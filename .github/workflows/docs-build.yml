name: docs-build

on:
  release:
    types: [published]
  workflow_dispatch:
  push:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build Docs
        uses: dotkernel/documentation-theme/github-actions/docs@dev
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
